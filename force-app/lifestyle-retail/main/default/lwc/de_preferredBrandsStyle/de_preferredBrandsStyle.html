<template>
    <div class="card">
        <div class="card-header">
            <span class="card-title">Preferred Brands &amp; Style</span>
            <a class="edit-link" onclick={handleEdit}>Edit</a>
        </div>

        <p class="group-label">Favourite Brands:</p>
        <div class="chip-row">
            <template for:each={brands} for:item="b">
                <span key={b} class="chip">{b}</span>
            </template>
        </div>

        <p class="group-label">Preferred Categories:</p>
        <div class="chip-row">
            <template for:each={categories} for:item="c">
                <span key={c} class="chip">{c}</span>
            </template>
        </div>

        <p class="group-label">Preferred Size:</p>
        <p class="size-text">Apparel: {apparelSize}&nbsp;&nbsp;&nbsp;Footwear: {footwearSize}</p>
    </div>
</template>
